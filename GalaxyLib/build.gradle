plugins {
    id 'java'
    id 'java-library'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    //uncomment if common is a mod.
    /**
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
 */
}

repositories {
    mavenLocal()
    maven { url = "https://maven.firstdark.dev/snapshots" }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
}

dependencies {
    // Shared third-party deps used by module code (primarily Biotech)
    api("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all")
    api("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    compileOnly("org.jetbrains:annotations:${jetbrains_annotations_version}")
}

jar{
    manifest {
        attributes(
                'FMLModType': 'GAMELIBRARY'
        )
    }
}
